name: petit_httpd
description: A simple HTTP file server integrated with Let's Encrypt, gzip and CORS.
version: 1.1.0
homepage: https://github.com/gmpassos/petit_httpd

environment:
  sdk: ^3.13.0

executables:
  petit_httpd:

dependencies:
  args_simple: ^1.2.0
  shelf: ^1.4.3
  shelf_static: ^1.2.0
  shelf_gzip: ^4.1.0
  shelf_letsencrypt: ^2.0.8

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
  dependency_validator: ^5.1.0
  coverage: ^1.16.0
  pubspec_parse: ^1.7.0
  path: ^1.9.1
  mercury_client: ^2.4.0

